name: format-check

on:
  push:
  pull_request:

jobs:
  verify-formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and packages
        run: dotnet restore Module17_WebApi/Module17_WebApi.slnx

      - name: Verify formatting
        run: dotnet format Module17_WebApi/Module17_WebApi.slnx --verify-no-changes